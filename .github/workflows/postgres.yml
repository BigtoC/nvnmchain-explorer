# Fork-owned: ci.yml is upstream's, and a job appended there would conflict
# with upstream's next change to it. See docs/database.md.
name: Postgres

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  RUSTFLAGS: "-D warnings"

jobs:
  postgres:
    name: Test (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6 # same tag as docker-compose.yml
        env:
          POSTGRES_USER: explorer
          POSTGRES_PASSWORD: explorer
          POSTGRES_DB: explorer
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U explorer -d explorer"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The tests are #[ignore]d so plain `cargo test` needs no server; here
      # they must run, and fail rather than skip if PG_TEST_URL is missing.
      - name: Schema parity and baseline round-trip
        run: cargo test --test postgres -- --include-ignored
        env:
          PG_TEST_URL: postgres://explorer:explorer@localhost:5432/explorer
